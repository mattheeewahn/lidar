<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배달로봇 컨트롤러</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; color: #00d4ff; }
        
        .mode-switch {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .mode-btn {
            padding: 12px 30px;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: bold;
        }
        
        .controls {
            display: grid;
            grid-template-areas:
                ". up ."
                "left stop right"
                ". down .";
            gap: 10px;
            margin-bottom: 30px;
        }
        .ctrl-btn {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            background: #16213e;
            color: #eee;
            border: 2px solid #0f3460;
            transition: all 0.1s;
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active { background: #00d4ff; color: #1a1a2e; transform: scale(0.95); }
        .ctrl-btn.stop-btn { background: #e94560; grid-area: stop; }
        [data-dir="up"] { grid-area: up; }
        [data-dir="down"] { grid-area: down; }
        [data-dir="left"] { grid-area: left; }
        [data-dir="right"] { grid-area: right; }
        
        .emergency {
            padding: 20px 60px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .emergency:active { background: #cc0000; }
        
        .status {
            margin-top: 20px;
            padding: 10px 20px;
            background: #16213e;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .speed-control {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .speed-control input { width: 200px; }
    </style>
</head>
<body>
    <h1>🤖 배달로봇 컨트롤러</h1>
    
    <div class="mode-switch">
        <button class="mode-btn active" id="manualBtn" onclick="setMode('manual')">🎮 수동</button>
        <button class="mode-btn" id="autoBtn" onclick="setMode('auto')">🧠 자율주행</button>
    </div>
    
    <div class="speed-control">
        <span>속도:</span>
        <input type="range" id="speedSlider" min="50" max="255" value="150">
        <span id="speedValue">150</span>
    </div>
    
    <div class="controls" id="manualControls">
        <button class="ctrl-btn" data-dir="up" data-cmd="F">▲</button>
        <button class="ctrl-btn" data-dir="left" data-cmd="SL">◄</button>
        <button class="ctrl-btn ctrl-btn stop-btn" data-cmd="S">■</button>
        <button class="ctrl-btn" data-dir="right" data-cmd="SR">►</button>
        <button class="ctrl-btn" data-dir="down" data-cmd="B">▼</button>
    </div>
    
    <button class="emergency" onclick="emergencyStop()">🚨 비상정지</button>
    
    <div class="status" id="status">모드: 수동 | 대기중</div>

    <script>
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        
        speedSlider.oninput = () => speedValue.textContent = speedSlider.value;
        
        // 버튼 터치/클릭 이벤트
        document.querySelectorAll('.ctrl-btn').forEach(btn => {
            const cmd = btn.dataset.cmd;
            
            // 누르면 이동, 떼면 정지
            btn.addEventListener('mousedown', () => sendCmd(cmd));
            btn.addEventListener('mouseup', () => sendCmd('S'));
            btn.addEventListener('mouseleave', () => sendCmd('S'));
            
            // 모바일 터치
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); sendCmd(cmd); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); sendCmd('S'); });
        });
        
        // 키보드 조작
        const keyMap = { ArrowUp: 'F', ArrowDown: 'B', ArrowLeft: 'SL', ArrowRight: 'SR' };
        document.addEventListener('keydown', (e) => {
            if (keyMap[e.key]) sendCmd(keyMap[e.key]);
        });
        document.addEventListener('keyup', (e) => {
            if (keyMap[e.key]) sendCmd('S');
        });
        
        function sendCmd(cmd) {
            fetch('/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cmd: cmd, speed: parseInt(speedSlider.value)})
            });
            document.getElementById('status').textContent = `모드: 수동 | 명령: ${cmd}`;
        }
        
        function setMode(mode) {
            fetch('/mode', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mode: mode})
            }).then(r => r.json()).then(data => {
                document.getElementById('manualBtn').classList.toggle('active', data.mode === 'manual');
                document.getElementById('autoBtn').classList.toggle('active', data.mode === 'auto');
                document.getElementById('manualControls').style.opacity = data.mode === 'manual' ? '1' : '0.3';
                document.getElementById('status').textContent = `모드: ${data.mode === 'auto' ? '자율주행' : '수동'}`;
            });
        }
        
        function emergencyStop() {
            fetch('/stop', {method: 'POST'}).then(r => r.json()).then(data => {
                document.getElementById('status').textContent = '🚨 비상정지! 수동모드로 전환됨';
                document.getElementById('manualBtn').classList.add('active');
                document.getElementById('autoBtn').classList.remove('active');
            });
        }
    </script>
</body>
</html>
